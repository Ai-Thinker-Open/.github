<svg xmlns="http://www.w3.org/2000/svg" width="520" height="84" viewBox="0 0 520 84" role="img" aria-label="skills">
  <defs>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#58a6ff"/>
      <stop offset="1" stop-color="#1f6feb"/>
    </linearGradient>
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
    <filter id="pillShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#58a6ff" flood-opacity="0.4"/>
    </filter>
  </defs>
  <g filter="url(#cardShadow)">
    <rect x="0.5" y="0.5" width="519" height="83" rx="16" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  </g>
  <text x="22" y="32" font-family="'Segoe UI',-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="16" font-weight="700" letter-spacing="-0.2" fill="#e6edf3">skills</text>
  <text x="22" y="58" font-family="'Segoe UI',-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="11" fill="#8b949e">安信可科技skills，含安信可编码规范，含安信可常规模组开发skills</text>
  <g filter="url(#pillShadow)">
    <rect x="438" y="28" width="60" height="28" rx="14" fill="url(#brand)"/>
  </g>
  <text x="468" y="46.5" text-anchor="middle" font-family="'Segoe UI',-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="13.5" font-weight="700" fill="#ffffff">8</text>
</svg>
