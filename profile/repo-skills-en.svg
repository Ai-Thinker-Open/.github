<svg xmlns="http://www.w3.org/2000/svg" width="400" height="80" viewBox="0 0 400 80" role="img" aria-label="skills">
  <defs>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#58a6ff"/>
      <stop offset="1" stop-color="#1f6feb"/>
    </linearGradient>
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
    <filter id="pillShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#58a6ff" flood-opacity="0.4"/>
    </filter>
  </defs>
  <g filter="url(#cardShadow)">
    <rect x="0.5" y="0.5" width="399" height="79" rx="16" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  </g>
  <text x="22" y="40" font-family="'Segoe UI',-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="16" font-weight="700" letter-spacing="-0.2" fill="#e6edf3">skills</text>
  <text x="22" y="60" font-family="'Segoe UI',-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="12.5" fill="#8b949e">Official developer skills</text>
  <g filter="url(#pillShadow)">
    <rect x="318" y="27" width="60" height="26" rx="13" fill="url(#brand)"/>
  </g>
  <text x="348" y="44.5" text-anchor="middle" font-family="'Segoe UI',-apple-system,'Helvetica Neue',Arial,sans-serif" font-size="13" font-weight="700" fill="#ffffff">8</text>
</svg>
