name: Update stats badges

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
  discussion:
  discussion_comment:

permissions:
  contents: write

jobs:
  update-badge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch stats
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          DISCUSSIONS="$(gh api graphql -f query='
            query {
              repository(owner: "Ai-Thinker-Open", name: ".github") {
                discussions {
                  totalCount
                }
              }
            }
          ' -q .data.repository.discussions.totalCount)"
          REPOS="$(gh api /orgs/Ai-Thinker-Open --jq .public_repos)"
          STARS="$(gh api --paginate "/orgs/Ai-Thinker-Open/repos?per_page=100&type=public" --jq '[.[].stargazers_count] | add // 0')"
          echo "discussions=$DISCUSSIONS" >> "$GITHUB_ENV"
          echo "repos=$REPOS" >> "$GITHUB_ENV"
          echo "stars=$STARS" >> "$GITHUB_ENV"

      - name: Update badges JSON
        run: |
          jq -n \
            --argjson discussions "${DISCUSSIONS}" \
            --argjson repos "${REPOS}" \
            --argjson stars "${STARS}" \
            '{discussions: $discussions, repos: $repos, stars: $stars}' \
            > profile/badges.json

      - name: Update discussion card SVGs
        run: |
          sed -i -E "s|(fill=\"#58a6ff\">)[0-9]+(</text>)|\1${DISCUSSIONS}\2|" profile/discussions-card-en.svg profile/discussions-card-zh.svg

      - name: Commit badge update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/
          if git diff --cached --quiet; then
            echo "No changes to badges"
          else
            git commit -m "chore: update stats badges"
            git push
          fi
