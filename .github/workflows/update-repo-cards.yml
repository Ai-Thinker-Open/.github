name: Update Recommended Repo Cards

# 每日定时 + 可手动触发，用 gh CLI 拉取各仓库最新 Star 数并自动更新 SVG 卡片
on:
  schedule:
    - cron: "0 3 * * *"   # 每天 03:00 UTC
  workflow_dispatch:       # 可在 Actions 页面手动点击运行

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update star counts via gh CLI
        # gh 会自动读取 GH_TOKEN / GITHUB_TOKEN，无需 gh auth login；
        # 若执行 gh auth login，反而会因环境变量中已存在 token 而报错退出。
        run: |
          python .github/scripts/update_cards.py
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit and push if changed
        run: |
          if ! git diff --quiet -- profile/repo-*.svg; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add profile/repo-*.svg
            git commit -m "chore: update recommended repo star counts"
            git push
          fi
